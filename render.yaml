services:
  - type: web
    name: zuno-erp-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run db:generate && npm run build:api
    startCommand: node apps/api/dist/apps/api/src/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: GMAIL_USER
        value: kavimkumarm6383@gmail.com
      - key: GMAIL_APP_PASSWORD
        value: zuvrttbhikhbwilk
      - key: MAIL_FROM_ADDRESS
        value: kavimkumarm6383@gmail.com
      - key: MAIL_FROM_NAME
        value: "Zuno ERP Security"
      - key: DATABASE_URL
        fromDatabase:
          name: zuno-postgres
          property: connectionString
      - key: NEON_DATABASE_URL
        fromDatabase:
          name: zuno-postgres
          property: connectionString

databases:
  - name: zuno-postgres
    plan: free
    region: oregon
    databaseName: zuno_erp
    user: zuno_admin

