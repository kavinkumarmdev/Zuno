services:
  - type: web
    name: zuno-erp-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:api
    startCommand: node apps/api/dist/apps/api/src/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: zuno-postgres
          property: connectionString

databases:
  - name: zuno-postgres
    plan: free
    region: oregon
    databaseName: zuno_erp
    user: zuno_admin
